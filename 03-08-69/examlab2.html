<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Lab 2</title>
    <link rel="stylesheet" href="examlab2.css" />
  </head>
  <body>
    <div align="center" class="card">
      <h1>สมัคร</h1>
      <p>ง่ายและเร็ว</p>
      <form>
        <input type="text" name="name" placeholder="ชื่อ-นามสกุล" />
        <br /><br />
        <input type="text" name="phone" placeholder="หมายเลขโทรศัพท์มือถือหรืออีเมล" />
        <br /><br />
        <input type="text" name="password" placeholder="Password" />
        <br /><br />
        <select name="Day" class="Date">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
          <option>10</option>
          <option>11</option>
          <option>12</option>
          <option>13</option>
          <option>14</option>
          <option>15</option>
          <option>16</option>
          <option>17</option>
          <option>18</option>
          <option>19</option>
          <option>20</option>
          <option>21</option>
          <option>22</option>
          <option>23</option>
          <option>24</option>
          <option>25</option>
          <option>26</option>
          <option>27</option>
          <option>28</option>
          <option>29</option>
          <option>30</option>
          <option>31</option>
        </select>
        <select name="month" class="Date">
          <option>มกราคม</option>
          <option>กุมภาพันธ์</option>
          <option>มีนาคม</option>
          <option>เมษายน</option>
          <option>พฤษภาคม</option>
          <option>มิถุนายน</option>
          <option>กรกฎาคม</option>
          <option>สิงหาคม</option>
          <option>กันยายน</option>
          <option>ตุลาคม</option>
          <option>พฤศจิกายน</option>
          <option>ธันวาคม</option>
        </select>
        <select name="year" class="Date">
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
            <option>2021</option>
            <option>2020</option>
            <option>2019</option>
            <option>2018</option>
            <option>2017</option>
            <option>2016</option>
            <option>2015</option>
            <option>2014</option>
            <option>2013</option>
            <option>2012</option>
            <option>2011</option>
            <option>2010</option>
            <option>2009</option>
            <option>2008</option>
            <option>2007</option>
            <option>2006</option>
            <option>2005</option>
            <option>2004</option>
            <option>2003</option>
            <option>2002</option>
            <option>2001</option>
            <option>2000</option>
        </select>
        <p>เพศ</p>
        <input type="radio" name="gender" value="male" class="Sex-Box"/> ชาย
        <input type="radio" name="gender" value="female" class="Sex-Box"/> หญิง
        <p>
          เมื่อคลิ๊กสมัคร แสดงว่าคุณยอมรับข้อกำหนด นโยบายข้อมูล
          และนโยบายคุกกี้ของเรา คุณอาจได้รับการแจ้งเตือนทาง SMS จากเราและ
          สามารถเลือกไม่รับได้ในภายหลัง
        </p>
        <button type="submit" class="submit">สมัคร</button>
      </form>
    </div>
  </body>
</html>
